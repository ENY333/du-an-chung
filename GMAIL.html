<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gmail Manager</title><link rel="stylesheet" href="style.css"></head><body><div class="gridbg"></div><main class="main" style="max-width:1400px;margin:auto"><div class="top"><a class="btn" href="CHUNG.html">← Hub</a><div class="search"><input id="search" placeholder="Tìm chức năng trong trang..."></div><button class="btn" onclick="document.body.classList.toggle('light')">☾/☀</button></div><div class="hero"><div class="eyebrow">ACCOUNT MANAGER</div><h1>Gmail Manager</h1><p class="muted">Quản lý username, link đăng nhập và bookmark. Không lưu mật khẩu.</p></div><div class="toolgrid" id="tools"></div></main><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}function dl(name,data,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}function copy(t){navigator.clipboard?.writeText(t);toast('Đã copy')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();document.querySelectorAll('.tool').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')}})</script>

<div class="card" style="grid-column:1/-1"><div class="notice">⚠️ Đây là <b>trình quản lý link tài khoản</b>, không phải email client. Không lưu mật khẩu trong LocalStorage.</div><div class="actions"><button class="btn primary" onclick="add()">＋ Thêm tài khoản</button><button class="btn" onclick="exportAccounts()">Backup</button><input type="file" accept=".json" onchange="importAccounts(this)"></div></div><div id="accountGrid" style="grid-column:1/-1" class="grid"></div>

<script>
const K='DH_GMAIL_ACCOUNTS';let a=JSON.parse(localStorage.getItem(K)||'[]');
function save(){localStorage.setItem(K,JSON.stringify(a));render()}function full(u){return u.includes('@')?u:u+'@gmail.com'}
function add(){let u=prompt('Username / email');if(!u)return;u=full(u);if(a.some(x=>x.email.toLowerCase()===u.toLowerCase()))return toast('Username đã tồn tại');a.push({id:Date.now(),email:u,label:prompt('Tên hiển thị')||u,login:'https://accounts.google.com/'});save()}
function render(){accountGrid.innerHTML=a.map(x=>`<div class="card tool"><h3>✉️ ${esc(x.label)}</h3><p class="muted">${esc(x.email)}</p><span class="tag">Không lưu password</span><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="navigator.clipboard?.writeText('${x.email}');toast('Đã copy')">Copy email</button><button class="btn" onclick="window.open('${x.login}','_blank')">Google Login</button><button class="btn" onclick="edit(${x.id})">Sửa</button><button class="btn danger" onclick="del(${x.id})">×</button></div></div>`).join('')||'<div class="card muted">Chưa có tài khoản.</div>'}
function edit(id){let x=a.find(z=>z.id===id),n=prompt('Username/email',x.email);if(!n)return;if(a.some(z=>z.id!==id&&z.email.toLowerCase()===full(n).toLowerCase()))return toast('Trùng username');x.email=full(n);x.label=prompt('Tên hiển thị',x.label)||x.email;save()}
function del(id){if(confirm('Xóa?')){a=a.filter(x=>x.id!==id);save()}}
function exportAccounts(){dl('gmail-manager.json',JSON.stringify(a,null,2),'application/json')}
function importAccounts(i){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(Array.isArray(x)){a=x.filter(z=>z.email);save();toast('Đã import')}}catch{toast('File lỗi')}};r.readAsText(i.files[0])}
render();
</script></body></html>
