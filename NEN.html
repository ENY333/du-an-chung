<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nén / Giải nén</title><link rel="stylesheet" href="style.css"><style id="embedded-fallback">
:root{--bg:#070b14;--panel:#0d1424e8;--panel2:#111a2d;--line:#24314d;--text:#edf3ff;--muted:#8ea0bd;--a:#7c5cff;--b:#19d3ae;--danger:#ff5577}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
body:before,body:after{content:"";position:fixed;z-index:-2;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none}
body:before{width:450px;height:450px;background:#795cff;left:-160px;top:-140px}body:after{width:520px;height:520px;background:#00d3b0;right:-220px;bottom:-180px}
body:has(.light){--bg:#eef3fa;--panel:#fffE;--panel2:#fff;--line:#d7e0ed;--text:#152033;--muted:#60708a}
.gridbg{position:fixed;inset:0;z-index:-3;opacity:.12;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px}
.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:18px 13px;border-right:1px solid var(--line);background:#080d18dd;backdrop-filter:blur(18px);z-index:5}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;padding:7px 10px 20px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#1bd8bf);box-shadow:0 10px 30px #655cff55}
.nav{display:grid;gap:5px}.nav a,.nav button{display:block;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);text-decoration:none;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit}.nav a:hover,.nav a.active,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
.sidebottom{position:absolute;bottom:15px;left:13px;right:13px;color:var(--muted);font-size:11px}.main{min-width:0;padding:20px 25px 60px}.top{display:flex;gap:9px;position:sticky;top:0;z-index:4;padding:3px 0 17px;background:linear-gradient(var(--bg) 65%,transparent)}.search{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:0 11px;backdrop-filter:blur(14px)}.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:11px;font:inherit}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 12px;cursor:pointer}.btn:hover{transform:translateY(-1px)}.primary{background:var(--a);border-color:var(--a);color:#fff}.danger{background:var(--danger);border-color:var(--danger);color:#fff}.hero{padding:20px 0}.eyebrow{font-size:11px;color:var(--b);font-weight:800;letter-spacing:.12em}.hero h1{font-size:clamp(28px,4vw,48px);line-height:1.04;margin:8px 0}.muted{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:15px;backdrop-filter:blur(14px);box-shadow:0 20px 60px #0005}.stat b{display:block;font-size:27px}.stat span{color:var(--muted);font-size:11px}.section{margin:22px 0 11px;display:flex;align-items:center;justify-content:space-between}.section h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.toolgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.tool h3{font-size:14px;margin:0 0 8px}.tool textarea,.tool input,.tool select,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0002;color:var(--text);border-radius:8px;padding:8px;outline:0;font:inherit}.tool textarea{min-height:72px}.result{min-height:24px;margin:7px 0;color:var(--b);font-size:12px;white-space:pre-wrap;word-break:break-word}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:10px;color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}.notice{padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin:10px 0}.module h3{margin:0}.module p{font-size:12px;color:var(--muted);min-height:36px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(620px,96vw);max-height:90vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:18px}.toast{position:fixed;right:18px;bottom:18px;padding:10px 13px;background:#111a2d;color:#fff;border:1px solid #344563;border-radius:10px;display:none;z-index:30}.toast.show{display:block}.mobile{display:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.toolgrid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.side{position:fixed;left:-270px;width:255px;transition:.2s}.side.open{left:0}.mobile{display:block}.main{padding:12px}.cards,.toolgrid,.grid{grid-template-columns:1fr}}
</style></head><body><div class="gridbg"></div><main class="main" style="max-width:1400px;margin:auto"><div class="top"><a class="btn" href="CHUNG.html">← Hub</a><div class="search"><input id="search" placeholder="Tìm chức năng trong trang..."></div><button class="btn" onclick="document.body.classList.toggle('light')">☾/☀</button></div><div class="hero"><div class="eyebrow">DATA LAB</div><h1>Nén / Giải nén</h1><p class="muted">Nén dữ liệu, chuyển mã và tạo file trực tiếp trên trình duyệt.</p></div><div class="toolgrid" id="tools"></div></main><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}function dl(name,data,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}function copy(t){navigator.clipboard?.writeText(t);toast('Đã copy')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();document.querySelectorAll('.tool').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')}})</script>
<div class="toolgrid" id="tools"><div class="card tool"><h3>Text → GZIP</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'gzip')">Chạy</button></div><div class="card tool"><h3>GZIP → Text</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'gunzip')">Chạy</button></div><div class="card tool"><h3>Text → Base64</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'b64')">Chạy</button></div><div class="card tool"><h3>Base64 → Text</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'db64')">Chạy</button></div><div class="card tool"><h3>URL Encode</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'ue')">Chạy</button></div><div class="card tool"><h3>URL Decode</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'ud')">Chạy</button></div><div class="card tool"><h3>JSON minify</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'jm')">Chạy</button></div><div class="card tool"><h3>JSON format</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'jf')">Chạy</button></div><div class="card tool"><h3>CSV lines</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'csv')">Chạy</button></div><div class="card tool"><h3>Đếm bytes</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'bytes')">Chạy</button></div><div class="card tool"><h3>Đếm KB</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'kb')">Chạy</button></div><div class="card tool"><h3>SHA-256</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'sha')">Chạy</button></div><div class="card tool"><h3>UUID</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'uuid')">Chạy</button></div><div class="card tool"><h3>Blob TXT</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'txt')">Chạy</button></div><div class="card tool"><h3>Download JSON</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'json')">Chạy</button></div><div class="card tool"><h3>Copy output</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'copy')">Chạy</button></div><div class="card tool"><h3>Clear</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'clear')">Chạy</button></div></div>
<script>
async function run(b,t){let c=b.closest('.tool'),v=c.querySelector('.inp').value,r=c.querySelector('.result');try{
if(t==='gzip'){let s=await compress(v);r.textContent=btoa(String.fromCharCode(...new Uint8Array(s)))}
else if(t==='gunzip'){r.textContent=await decompress(Uint8Array.from(atob(v),c=>c.charCodeAt(0)))}
else if(t==='b64')r.textContent=btoa(unescape(encodeURIComponent(v)));else if(t==='db64')r.textContent=decodeURIComponent(escape(atob(v)));
else if(t==='ue')r.textContent=encodeURIComponent(v);else if(t==='ud')r.textContent=decodeURIComponent(v);else if(t==='jm')r.textContent=JSON.stringify(JSON.parse(v));else if(t==='jf')r.textContent=JSON.stringify(JSON.parse(v),null,2);
else if(t==='csv')r.textContent=v.split(/\r?\n/).filter(Boolean).length+' dòng';else if(t==='bytes')r.textContent=new Blob([v]).size+' bytes';else if(t==='kb')r.textContent=(new Blob([v]).size/1024).toFixed(2)+' KB';
else if(t==='sha'){let x=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));r.textContent=[...new Uint8Array(x)].map(x=>x.toString(16).padStart(2,'0')).join('')}
else if(t==='uuid')r.textContent=crypto.randomUUID();else if(t==='txt')dl('data.txt',v);else if(t==='json')dl('data.json',v,'application/json');else if(t==='copy')copy(v);else if(t==='clear')c.querySelector('.inp').value='';
}catch(e){r.textContent='Lỗi: '+e.message}}
async function compress(s){let cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(s));w.close();return new Response(cs.readable).arrayBuffer()}
async function decompress(a){let ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(a);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
</script></body></html>
