<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nén / Giải nén</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="gridbg"></div><main class="main" style="max-width:1400px;margin:auto"><div class="top"><a class="btn" href="../CHUNG.html">← Hub</a><div class="search"><input id="search" placeholder="Tìm chức năng trong trang..."></div><button class="btn" onclick="document.body.classList.toggle('light')">☾/☀</button></div><div class="hero"><div class="eyebrow">DATA LAB</div><h1>Nén / Giải nén</h1><p class="muted">Nén dữ liệu, chuyển mã và tạo file trực tiếp trên trình duyệt.</p></div><div class="toolgrid" id="tools"></div></main><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}function dl(name,data,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}function copy(t){navigator.clipboard?.writeText(t);toast('Đã copy')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();document.querySelectorAll('.tool').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')}})</script>
<div id="tools"><div class="card tool"><h3>Text → GZIP</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'gzip')">Chạy</button></div><div class="card tool"><h3>GZIP → Text</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'gunzip')">Chạy</button></div><div class="card tool"><h3>Text → Base64</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'b64')">Chạy</button></div><div class="card tool"><h3>Base64 → Text</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'db64')">Chạy</button></div><div class="card tool"><h3>URL Encode</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'ue')">Chạy</button></div><div class="card tool"><h3>URL Decode</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'ud')">Chạy</button></div><div class="card tool"><h3>JSON minify</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'jm')">Chạy</button></div><div class="card tool"><h3>JSON format</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'jf')">Chạy</button></div><div class="card tool"><h3>CSV lines</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'csv')">Chạy</button></div><div class="card tool"><h3>Đếm bytes</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'bytes')">Chạy</button></div><div class="card tool"><h3>Đếm KB</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'kb')">Chạy</button></div><div class="card tool"><h3>SHA-256</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'sha')">Chạy</button></div><div class="card tool"><h3>UUID</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'uuid')">Chạy</button></div><div class="card tool"><h3>Blob TXT</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'txt')">Chạy</button></div><div class="card tool"><h3>Download JSON</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'json')">Chạy</button></div><div class="card tool"><h3>Copy output</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'copy')">Chạy</button></div><div class="card tool"><h3>Clear</h3><textarea placeholder="Dữ liệu..." class="inp"></textarea><div class="result"></div><button class="btn primary" onclick="run(this,'clear')">Chạy</button></div></div>
<script>
async function run(b,t){let c=b.closest('.tool'),v=c.querySelector('.inp').value,r=c.querySelector('.result');try{
if(t==='gzip'){let s=await compress(v);r.textContent=btoa(String.fromCharCode(...new Uint8Array(s)))}
else if(t==='gunzip'){r.textContent=await decompress(Uint8Array.from(atob(v),c=>c.charCodeAt(0)))}
else if(t==='b64')r.textContent=btoa(unescape(encodeURIComponent(v)));else if(t==='db64')r.textContent=decodeURIComponent(escape(atob(v)));
else if(t==='ue')r.textContent=encodeURIComponent(v);else if(t==='ud')r.textContent=decodeURIComponent(v);else if(t==='jm')r.textContent=JSON.stringify(JSON.parse(v));else if(t==='jf')r.textContent=JSON.stringify(JSON.parse(v),null,2);
else if(t==='csv')r.textContent=v.split(/\r?\n/).filter(Boolean).length+' dòng';else if(t==='bytes')r.textContent=new Blob([v]).size+' bytes';else if(t==='kb')r.textContent=(new Blob([v]).size/1024).toFixed(2)+' KB';
else if(t==='sha'){let x=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));r.textContent=[...new Uint8Array(x)].map(x=>x.toString(16).padStart(2,'0')).join('')}
else if(t==='uuid')r.textContent=crypto.randomUUID();else if(t==='txt')dl('data.txt',v);else if(t==='json')dl('data.json',v,'application/json');else if(t==='copy')copy(v);else if(t==='clear')c.querySelector('.inp').value='';
}catch(e){r.textContent='Lỗi: '+e.message}}
async function compress(s){let cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(s));w.close();return new Response(cs.readable).arrayBuffer()}
async function decompress(a){let ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(a);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
</script></body></html>
