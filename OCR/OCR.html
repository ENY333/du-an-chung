<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Diện Ký Tự - OCR</title>
    <link rel="stylesheet" href="../css/CHUNG.css">
    <style>
        .tool-panel {
            max-width: 800px;
            margin: 30px auto;
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .back-link { display: inline-block; text-decoration: none; color: #2563eb; font-weight: 500; margin-bottom: 16px; }
        .dropzone {
            border: 2px dashed #94a3b8;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: #f1f5f9;
            margin-bottom: 20px;
        }
        .res-area { width: 100%; min-height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body style="background: #f8fafc; padding: 20px; font-family: system-ui, sans-serif;">
    <div class="tool-panel">
        <a href="../CHUNG.html" class="back-link">⬅ Trang Chủ</a>
        <h2 style="margin-top: 0;">🔍 Trích Xuất Chữ OCR Từ Ảnh</h2>
        <p style="color: #64748b; font-size: 14px;">Tải lên hoặc dán ảnh tài liệu để nhận diện nội dung văn bản.</p>

        <div class="dropzone" onclick="document.getElementById('file-input').click()">
            📁 Bấm vào đây để chọn ảnh hoặc kéo thả ảnh vào khung
            <input type="file" id="file-input" accept="image/*" style="display:none;">
        </div>

        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Kết quả trích xuất văn bản:</label>
        <textarea class="res-area" placeholder="Nội dung chữ sau khi quét sẽ xuất hiện ở đây..."></textarea>
    </div>
</body>
</html>
