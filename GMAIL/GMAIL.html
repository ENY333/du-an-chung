<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ef4444'/%3E%3Cstop offset='50%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%23581c87'/%3E%3C/linearGradient%3E%3ClinearGradient id='lt' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fbcfe8'/%3E%3Cstop offset='100%25' stop-color='%23ffffff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='8' y='8' width='112' height='112' rx='28' fill='url(%23bg)'/%3E%3Ccircle cx='64' cy='64' r='32' fill='none' stroke='%23f472b6' stroke-width='6' stroke-dasharray='10 6' opacity='0.85'/%3E%3Ccircle cx='64' cy='64' r='22' fill='%233b0764' opacity='0.7'/%3E%3Cpolygon points='68,26 44,68 62,68 60,102 84,60 66,60' fill='url(%23lt)'/%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Gmail</title>
    <link rel="stylesheet" href="../css/CHUNG.css">
    <style>
        .tool-panel {
            max-width: 800px;
            margin: 30px auto;
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .back-link { display: inline-block; text-decoration: none; color: #2563eb; font-weight: 500; margin-bottom: 16px; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        .input-text { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body style="background: #f8fafc; padding: 20px; font-family: system-ui, sans-serif;">
    <div class="tool-panel">
        <a href="../CHUNG.html" class="back-link">⬅ Trang Chủ</a>
        <h2 style="margin-top: 0;">✉️ Tiện Ích GMAIL</h2>
        <p style="color: #64748b; font-size: 14px;">Quản lý mẫu gửi thư và thao tác nhanh với hòm thư điện tử.</p>

        <div class="input-group">
            <label>Địa chỉ người nhận:</label>
            <input type="email" class="input-text" placeholder="example@gmail.com">
        </div>

        <div class="input-group">
            <label>Tiêu đề thư:</label>
            <input type="text" class="input-text" placeholder="Nhập tiêu đề...">
        </div>

        <div class="input-group">
            <label>Nội dung:</label>
            <textarea class="input-text" rows="5" placeholder="Soạn nội dung thư..."></textarea>
        </div>

        <button class="btn-submit">Xác Nhận Xử Lý</button>
    </div>
</body>
</html>
